name: QCEC Stage 3A-R1 Zero-Secret Auth Contract Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - runtime/ibm/requirements.lock.txt
      - runtime/ibm/runtime_lock.json
      - runtime/qi/vendor/conda-explicit-replay.lock.txt
      - runtime/qi/vendor/pip-freeze.txt
      - scripts/qcec_stage3ar1_auth_contract_probe.py
      - .github/workflows/qcec-stage3ar1-zero-secret-auth-contract.yml

permissions:
  contents: read

jobs:
  zero-secret-auth-contract-discovery:
    runs-on: ubuntu-latest
    env:
      SECRETS_READ: "0"
      SECRETS_ADDED: "0"
      PROVIDER_AUTH_ATTEMPTED: "0"
      PROVIDER_API_REQUEST_ATTEMPTED: "0"
      BACKEND_QUERY_ATTEMPTED: "0"
      SIMULATOR_JOBS_CREATED: "0"
      HARDWARE_JOBS_CREATED: "0"
      STAGE3B_STARTED: "FALSE"
    steps:
      - name: Check out the public discovery repository
        uses: actions/checkout@v5

      - name: Materialize runner-local paths
        shell: bash
        run: |
          echo "IBM_ENV_PREFIX=${RUNNER_TEMP}/qcec-stage3ar1-ibm" >> "$GITHUB_ENV"
          echo "QI_ENV_PREFIX=${RUNNER_TEMP}/qcec-stage3ar1-qi" >> "$GITHUB_ENV"

      - name: Verify all frozen runtime inputs
        run: python scripts/qcec_stage3ar1_auth_contract_probe.py preflight

      - name: Select the frozen IBM Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: ""

      - name: Replay the frozen IBM runtime
        shell: bash
        run: |
          set +e
          python -m venv "${IBM_ENV_PREFIX}"
          "${IBM_ENV_PREFIX}/bin/python" -m pip install \
            --no-deps \
            --only-binary=:all: \
            --disable-pip-version-check \
            -r runtime/ibm/requirements.lock.txt
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            python scripts/qcec_stage3ar1_auth_contract_probe.py emit-stop \
              --provider ibm \
              --reason "Frozen IBM runtime replay failed without dependency resolution." \
              --output auth/ibm_auth_contract.json
            exit 2
          fi

      - name: Probe the IBM authentication contract without credentials
        run: >-
          "${IBM_ENV_PREFIX}/bin/python"
          scripts/qcec_stage3ar1_auth_contract_probe.py probe-ibm
          --output auth/ibm_auth_contract.json

      - name: Install Micromamba transport only
        uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: none
          generate-run-shell: false
          cache-environment: false
          cache-downloads: false
          post-cleanup: all

      - name: Replay the exact frozen QI Conda base
        shell: bash
        run: |
          set +e
          micromamba create --yes \
            --prefix "${QI_ENV_PREFIX}" \
            --file runtime/qi/vendor/conda-explicit-replay.lock.txt \
            --no-deps
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            python scripts/qcec_stage3ar1_auth_contract_probe.py emit-stop \
              --provider qi \
              --reason "Frozen QI Conda base replay failed." \
              --output auth/qi_auth_contract.json
            exit 2
          fi

      - name: Replay the frozen QI pip layer without resolution
        shell: bash
        run: |
          set +e
          micromamba run --prefix "${QI_ENV_PREFIX}" \
            python -m pip install \
            --no-deps \
            --only-binary=:all: \
            --disable-pip-version-check \
            -r runtime/qi/vendor/pip-freeze.txt
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            python scripts/qcec_stage3ar1_auth_contract_probe.py emit-stop \
              --provider qi \
              --reason "Frozen QI pip layer replay failed without dependency resolution." \
              --output auth/qi_auth_contract.json
            exit 2
          fi

      - name: Probe the QI authentication contract without login
        run: >-
          micromamba run --prefix "${QI_ENV_PREFIX}"
          python scripts/qcec_stage3ar1_auth_contract_probe.py probe-qi
          --output auth/qi_auth_contract.json

      - name: Freeze the Stage 3A-R1 contract manifest
        if: always()
        run: >-
          python scripts/qcec_stage3ar1_auth_contract_probe.py manifest
          --ibm auth/ibm_auth_contract.json
          --qi auth/qi_auth_contract.json
          --output auth/QCEC_STAGE3AR1_AUTH_CONTRACT_MANIFEST.json

      - name: Prove the zero-secret safety boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            "SECRETS_READ=${SECRETS_READ}" \
            "SECRETS_ADDED=${SECRETS_ADDED}" \
            "PROVIDER_AUTH_ATTEMPTED=${PROVIDER_AUTH_ATTEMPTED}" \
            "PROVIDER_API_REQUEST_ATTEMPTED=${PROVIDER_API_REQUEST_ATTEMPTED}" \
            "BACKEND_QUERY_ATTEMPTED=${BACKEND_QUERY_ATTEMPTED}" \
            "SIMULATOR_JOBS_CREATED=${SIMULATOR_JOBS_CREATED}" \
            "HARDWARE_JOBS_CREATED=${HARDWARE_JOBS_CREATED}" \
            "STAGE3B_STARTED=${STAGE3B_STARTED}"
          test "${SECRETS_READ}" = "0"
          test "${SECRETS_ADDED}" = "0"
          test "${PROVIDER_AUTH_ATTEMPTED}" = "0"
          test "${PROVIDER_API_REQUEST_ATTEMPTED}" = "0"
          test "${BACKEND_QUERY_ATTEMPTED}" = "0"
          test "${SIMULATOR_JOBS_CREATED}" = "0"
          test "${HARDWARE_JOBS_CREATED}" = "0"
          test "${STAGE3B_STARTED}" = "FALSE"

      - name: Upload the complete authentication contracts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qcec-stage3ar1-zero-secret-auth-contracts
          path: auth/
          if-no-files-found: error
          retention-days: 90
