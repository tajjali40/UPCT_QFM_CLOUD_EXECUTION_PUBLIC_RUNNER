name: TDMGE R2 G1 Official Acquisition

on:
  push:
    branches:
      - tdmge-r2-g1-20261001
    paths:
      - 'tdmge_r2_runner/**'
      - '.github/workflows/tdmge-r2-g1.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  r2-g1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}/tdmge_r2_runner/src
      TDMGE_RUN_ROOT: ${{ github.workspace }}/R2_G1_RUN
      TDMGE_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen scientific source hashes
        shell: bash
        run: |
          set -euo pipefail
          cd tdmge_r2_runner
          cat > /tmp/expected.sha256 <<'EOF'
95c125786100de6065040a1f313d6236fcc3b41938356d80bc861c3bb2b2d28c  src/tdmge_market_r2/__init__.py
c649b0b1817236731406ec35692051471553c8bfc4db1380350e8d4b148c1911  src/tdmge_market_r2/acquire.py
3e3bb88ff1a5100e0adb7de02e87809a6d1fd7b4c825f2a6230fc3a4d7927d54  src/tdmge_market_r2/audit.py
43c5edf4f6d3dc06f53c840b4dd50477a277c2946918661d9b2b4e425e0c4076  src/tdmge_market_r2/cli.py
d013f215322dc44ec80efb8d47bcae25446174932d5146791531da124c97dd87  src/tdmge_market_r2/constants.py
0373325416efd1ff98fbcf10fd1fdf81ece1a23ce572a9a6d4e735970cd6555f  src/tdmge_market_r2/evidence_io.py
325c6cdbd63811dc2976412bb6dd1f08ffaff9243ae4b614e7ccb098a4396411  src/tdmge_market_r2/exact.py
abc31e2d32d9d01fc2dac5dfa1419164b476143f9304ac900b4cdb98368631de  src/tdmge_market_r2/fusion.py
d0dabbccb052777a1e90fbfea539fb77741fc14ba4c9fd55c9fca0bf8af2b87b  src/tdmge_market_r2/independent.py
bf0d51e33915cad70f13143dc6e83d4fae57f390f1b375e55412fff1332811ab  src/tdmge_market_r2/lawbook.py
049a6c3507a2c0175f9487e53845d2294b2e466aec82b0ddca9169543eead2a4  src/tdmge_market_r2/models.py
0ba98b118118ae1d06c678bac8e2ac87c3c7535f5e810d0706705814f2726ee1  src/tdmge_market_r2/parsers.py
9ecbb528bbcfb2a685c2d3da5f546e2cec9e4a2c4ce4e131024a259168c110fc  src/tdmge_market_r2/pipeline.py
94b33754541cf3d7c30c70531b9e527a189dd62271389587e2d8c1afc3d1a21b  src/tdmge_market_r2/state.py
afe056722c45beda42b1b7609c7ff5489e1d61d1ad0b7dc04cc1fb1f918aabce  pyproject.toml
7c56db8731baf534fffa484f86ac8444baf3cd045630375212794840de108dc6  runner_g1.py
EOF
          sha256sum -c /tmp/expected.sha256
          python -m py_compile runner_g1.py src/tdmge_market_r2/*.py

      - name: Environment record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TDMGE_RUN_ROOT"
          python --version | tee "$TDMGE_RUN_ROOT/PYTHON_VERSION.txt"
          uname -a | tee "$TDMGE_RUN_ROOT/RUNNER_UNAME.txt"
          df -h | tee "$TDMGE_RUN_ROOT/DISK_BEFORE.txt"

      - name: Run R2 G1 protocol
        id: scientific_run
        shell: bash
        run: |
          set +e
          python tdmge_r2_runner/runner_g1.py 2>&1 | tee "$TDMGE_RUN_ROOT/RUN_LOG.txt"
          code=${PIPESTATUS[0]}
          echo "$code" | tee "$TDMGE_RUN_ROOT/EXIT_CODE.txt"
          exit "$code"

      - name: Final filesystem record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee "$TDMGE_RUN_ROOT/DISK_AFTER.txt"
          find "$TDMGE_RUN_ROOT" -maxdepth 3 -type f -printf '%P\t%s\n' | sort > "$TDMGE_RUN_ROOT/ARTIFACT_INDEX.tsv"
          (cd "$TDMGE_RUN_ROOT" && find . -maxdepth 3 -type f ! -path './data_calval/*' ! -path './data_fresh/*' -print0 | sort -z | xargs -0 sha256sum) > "$TDMGE_RUN_ROOT/OUTPUT_SHA256.txt" || true

      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDMGE_R2_G1_ARTIFACTS
          path: |
            R2_G1_RUN/*.json
            R2_G1_RUN/*.txt
            R2_G1_RUN/*.tsv
            R2_G1_RUN/*.csv
            R2_G1_RUN/prep/*.json
            R2_G1_RUN/val_score/*.json
            R2_G1_RUN/fresh_prep/*.json
            R2_G1_RUN/fresh_score/*.json
          if-no-files-found: warn
          retention-days: 7
